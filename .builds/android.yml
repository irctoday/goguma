image: archlinux
packages:
  - android-sdk
  - android-sdk-build-tools
  - android-sdk-cmdline-tools-latest
  - android-sdk-platform-tools
  - clang
  - jdk21-openjdk
  # for flutter
  - unzip
sources:
  - https://github.com/irctoday/goguma.git
secrets:
  - 64f98067-fd93-42e0-9fc4-2bae7d748cc3 # keystore.jks
  - 106092f8-1cf4-415e-b36b-d9876ff507ae # keystore.properties
  - 4c39c4e2-569a-4060-b75e-295051737530 # google-services.json
  - ca03061d-9bc8-4d57-bf4a-15a6096afe59 # sentry-dsn.txt
artifacts:
  - goguma/build/app/outputs/bundle/release/app-release.aab
tasks:
  - flutter: |
      git clone --depth=1 --branch=stable https://github.com/flutter/flutter.git
      export PATH="$PATH:$PWD/flutter/bin"
      echo "PATH=$PATH" >>~/.buildenv
      flutter precache --android
      # need write permission or else licenses are never accepted
      sudo chown -R $USER /opt/android-sdk
      yes | flutter doctor --android-licenses >/dev/null
      flutter doctor -v
      mkdir -p ~/.gradle
      # the gradle daemon sometimes crashes
      echo "org.gradle.daemon=false" >>~/.gradle/gradle.properties
      # reduce memory usage by sharing the JVM between Gradle and the Kotlin compiler
      echo "kotlin.compiler.execution.strategy=in-process" >>~/.gradle/gradle.properties
      # workaround for OOM
      sudo mkswap -U clear --size 4G --file /swapfile
      sudo swapon /swapfile
      # clear package cache to save some disk space
      yes | yay -Scc
  - configure: |
      cd goguma
      [ -e ~/keystore.properties ] && ln -s ~/keystore.properties android/keystore.properties
      [ -e ~/keystore.jks ] && ln -s ~/keystore.jks android/keystore.jks
      flutter pub get
      if [ -e ~/google-services.json ]; then
        dart run tool/gen_main.dart --firebase ~/google-services.json lib/main_generated.dart
      fi
  - analyze: |
      cd goguma
      flutter analyze
  - test: |
      cd goguma
      flutter test --reporter expanded
  - build: |
      cd goguma
      tag="$(git describe --abbrev=0)"
      hash="$(git rev-parse --short=12 HEAD)"
      build_name="${tag#v}-dev+$hash"
      build_number="$(git rev-list --first-parent --count HEAD)"
      target=lib/main.dart
      if [ -e ~/google-services.json ]; then
        build_name="$build_name.firebase"
        target=lib/main_generated.dart
      fi
      sentry_dsn=""
      [ -e ~/sentry-dsn.txt ] && sentry_dsn="$(cat ~/sentry-dsn.txt)"
      flutter build appbundle \
        -PapplicationIdSuffix=.play \
        --build-name="$build_name" \
        --build-number="$build_number" \
        --target="$target" \
        --dart-define=SENTRY_DSN="$sentry_dsn" \
        --dart-define=SENTRY_ENVIRONMENT="play" \
        --dart-define=SENTRY_RELEASE="$build_name"
  - deploy: |
      cd goguma
      [ -e ~/.ssh/id_rsa ] || complete-build
      [ "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" ] || complete-build
      build_number="$(git rev-list --first-parent --count origin/master)"
      ssh_opts="-o StrictHostKeyChecking=no"
      ssh_host="deploy-goguma@sheeta.emersion.fr"
      scp $ssh_opts build/app/outputs/flutter-apk/app-release.apk "$ssh_host":fdroid-nightly/repo/goguma-"$build_number".apk
      ssh $ssh_opts "$ssh_host" "cd fdroid-nightly && (ls -t repo/*.apk | tail -n +5 | xargs -r rm --) && fdroid update"
